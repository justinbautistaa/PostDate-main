name: Private encrypted backup
on:
  workflow_dispatch:
  schedule:
    # 22:00 Asia/Manila; schedules may be delayed.
    - cron: '0 14 * * *'
permissions:
  contents: read
concurrency:
  group: postdate-private-backup
  cancel-in-progress: false
jobs:
  backup:
    # Copy to a private operations repository before activation.
    if: github.event.repository.private == true && vars.POSTDATE_BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: postdate-backups
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix backend --omit=dev
      - name: Create encrypted database and media archive
        env:
          MONGO_URI: ${{ secrets.BACKUP_MONGO_URI }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node backend/scripts/backupProduction.js
      - name: Record encrypted-file checksum
        working-directory: backups
        run: sha256sum *.encrypted > SHA256SUMS
      - name: Store encrypted archive off the web host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postdate-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Download stored copy for verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: postdate-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: roundtrip
      - name: Verify downloaded encrypted bytes
        working-directory: roundtrip
        run: sha256sum --check SHA256SUMS
